#!/usr/sbin/nft -f

define dns_proxy_mark = 0x1
define dns_proxy_port = 53

table inet dns_proxy {
    set dns_targets_v4 {
        type ipv4_addr
        elements = {
            8.8.8.8
        }
    }

    chain prerouting {
        type filter hook prerouting priority mangle; policy accept;

        # Avoid looping traffic that is already destined for local delivery.
        fib daddr type local return

        # Intercept forwarded DNS requests for selected upstream resolvers
        # and deliver them to the local transparent DNS listener.
        ip daddr @dns_targets_v4 udp dport 53 meta mark set $dns_proxy_mark tproxy ip to :$dns_proxy_port accept
        ip daddr @dns_targets_v4 tcp dport 53 meta mark set $dns_proxy_mark tproxy ip to :$dns_proxy_port accept
    }

    chain output {
        type nat hook output priority -100; policy accept;

        # Intercept DNS requests generated by this host itself.
        ip daddr @dns_targets_v4 udp dport 53 redirect to :$dns_proxy_port
        ip daddr @dns_targets_v4 tcp dport 53 redirect to :$dns_proxy_port
    }
}
